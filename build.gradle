plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = 'justarod-forge'
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true
}

repositories {
    flatDir {
        dirs '../toNeko-Forge-1.20.1/forge/libs'
    }
    mavenCentral()
    maven { url = 'https://maven.architectury.dev/' }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

def toNekoForgeJar = file('../toNeko-Forge-1.20.1/forge/build/libs/toneko-forge-1.9.0+1.20.1-forge.0.jar')

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Transitional API bridge: this is Forgified Fabric API running on Forge,
    // never Connector. Calls will be replaced with Forge APIs incrementally.
    implementation fg.deobf('local.ffapi:fabric-api:0.92.6+1.11.14+1.20.1')
    implementation files(fileTree(dir: '../toNeko-Forge-1.20.1/forge/ffapi-compile', include: '*.jar'))
    implementation fg.deobf('local.geckolib:geckolib-forge-1.20.1:4.4.9')

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
    compileOnly 'org.projectlombok:lombok:1.18.30'

    if (toNekoForgeJar.exists()) {
        implementation fg.deobf(files(toNekoForgeJar))
    } else {
        logger.warn('toNeko Forge JAR is not available yet; JustARod compilation is intentionally deferred until the shared native API is built.')
    }
}

sourceSets.main.resources {
    exclude 'fabric.mod.json'
    exclude 'justarod.accessWideners.accessWidener'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

kotlin {
    jvmToolchain(17)
}

jar {
    manifest {
        attributes([
                'Specification-Title' : 'justarod',
                'Specification-Vendor': 'CSneko',
                'Specification-Version': '1',
                'Implementation-Title' : project.name,
                'Implementation-Version': project.version
        ])
    }
}
